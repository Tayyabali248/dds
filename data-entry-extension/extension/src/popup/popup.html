<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Data Entry Assistant</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h1>DDS Entry Assistant</h1>

  <div id="setup-section">
    <p class="field-label">Sales Officer</p>
    <p class="readonly-value" id="sales-officer-value">Reading from the page...</p>
    <button id="detect-username-btn" class="link-btn" type="button">Re-check</button>
    <p class="muted" id="username-hint">Read from the DDS page's own Sales Officer box, then checked against the roster. Log into PTCL POMS yourself first.</p>

    <label for="entries-input">Entries</label>
    <input type="number" id="entries-input" min="1" max="100" value="10" />

    <fieldset id="mode-fieldset">
      <legend>Mode</legend>
      <label class="radio-label">
        <input type="radio" name="mode" value="auto" id="mode-auto" />
        Auto Submit
      </label>
      <label class="radio-label">
        <input type="radio" name="mode" value="manual" id="mode-manual" checked />
        Manual Submit
      </label>
    </fieldset>
  </div>

  <div id="controls">
    <button id="start-btn">Start</button>
    <button id="pause-btn" class="secondary" disabled>Pause</button>
    <button id="resume-btn" class="secondary" disabled>Resume</button>
    <button id="stop-btn" class="danger" disabled>Stop</button>
  </div>

  <div id="progress-section">
    <p class="progress-line">Progress: <span id="progress-current">0</span> / <span id="progress-total">0</span></p>
    <p class="stats-line">
      Completed: <span id="stat-completed">0</span> &nbsp;
      Failed: <span id="stat-failed">0</span> &nbsp;
      Skipped: <span id="stat-skipped">0</span>
    </p>
    <p class="status-line" id="status-line">Idle</p>
  </div>

  <div id="error-section" class="hidden">
    <p class="error-text" id="error-text"></p>
    <button id="retry-btn">Retry</button>
    <button id="skip-btn" class="secondary">Skip</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
